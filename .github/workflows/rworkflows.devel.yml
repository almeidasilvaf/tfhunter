name: rworkflows.devel
'on':
  push:
    branches: devel
  pull_request:
    branches: devel
jobs:
  rworkflows:
    permissions: write-all
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    container: ${{ matrix.config.cont }}
    strategy:
      fail-fast: ${{ false }}
      matrix:
        config:
        - os: ubuntu-latest
          bioc: devel
          r: auto
          cont: ghcr.io/bioconductor/bioconductor_docker:devel
          rspm: ~
    steps:
    - name: Install HMMER
      run: |
        apt-get update
        apt-get install -y --no-install-recommends hmmer
        hmmsearch -h | head -n 2
    - uses: neurogenomics/rworkflows@master
      with:
        run_bioccheck: ${{ true }}
        run_rcmdcheck: ${{ true }}
        as_cran: ${{ false }}
        run_vignettes: ${{ false }}
        has_testthat: ${{ true }}
        run_covr: ${{ true }}
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run_pkgdown: ${{ true }}
        has_runit: ${{ false }}
        has_latex: ${{ false }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run_docker: ${{ false }}
        DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
        runner_os: ${{ runner.os }}
        cache_version: cache-v1
        docker_registry: ghcr.io